name: RF-DETR tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: conda-incubator/setup-miniconda@v4
        with:
          activate-environment: remind
          environment-file: environment.yml
      - name: Install test runner and run RF-DETR tests
        shell: bash -el {0}
        run: |
          python -m pip install pytest
          python -m pytest -q tests/
